<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <!--BASE-->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vertragsnavigator</title>
  <link rel="stylesheet" href="static/style.css" />
  <!-- PDF.js (CDN) für die markierbare PDF-Ansicht -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!--CONFIG-->
</head>
<body>
  <header id="kopf">
    <h1>Vertragsnavigator</h1>
    <form id="such-form" class="such-form">
      <input type="search" id="such-feld" placeholder="Suchen …" autocomplete="off" />
      <button type="button" id="such-erweitert-btn" title="Erweiterte Suche">⚙</button>
      <button type="submit" id="such-btn">Suchen</button>
    </form>
    <span id="status" class="status"></span>
    <button type="button" id="abmelden" class="abmelden" hidden>Abmelden</button>
  </header>

  <!-- Erweiterte Suchoptionen (Aufklapp) -->
  <div id="such-erweitert" class="such-erweitert" hidden>
    <div class="such-modi">
      <label><input type="radio" name="such-modus" value="stichwort" checked /> Stichwort</label>
      <label><input type="radio" name="such-modus" value="phrase" /> Phrase</label>
      <label><input type="radio" name="such-modus" value="und" /> UND</label>
      <label><input type="radio" name="such-modus" value="oder" /> ODER</label>
    </div>
    <label class="such-objekt">Objekt:
      <select id="such-tag"><option value="">— alle —</option></select>
    </label>
  </div>

  <!-- Suchergebnis-Panel -->
  <div id="such-panel" class="such-panel" hidden></div>

  <main id="layout">
    <!-- Spalte 1: Vertragsbaum -->
    <section id="spalte-baum" class="spalte">
      <h2>Verträge</h2>
      <label class="gruppieren-zeile">Objekt:
        <select id="gruppierung"></select>
      </label>
      <div id="baum" class="baum"></div>
    </section>

    <!-- Spalte 2: Dokumentenansicht (PDF markierbar bzw. OCR-Text) -->
    <section id="spalte-doc" class="spalte">
      <div id="doc-kopf" class="doc-kopf">
        <div class="doc-kopf-zeile">
          <h2 id="doc-titel">Kein Dokument gewählt</h2>
          <div class="doc-kopf-controls">
            <div id="treffer-nav" class="treffer-nav" hidden>
              <button type="button" id="treffer-prev" title="Vorheriger Treffer">‹</button>
              <span id="treffer-anzeige">Treffer 0/0</span>
              <button type="button" id="treffer-next" title="Nächster Treffer">›</button>
              <button type="button" id="treffer-zu" title="Suche schließen">✕</button>
            </div>
            <div id="pdf-zoom" class="pdf-zoom" hidden>
              <button type="button" id="btn-zoom-out" class="zoom-btn" title="Verkleinern">−</button>
              <span id="zoom-anzeige" class="zoom-anzeige">100 %</span>
              <button type="button" id="btn-zoom-in" class="zoom-btn" title="Vergrößern">+</button>
            </div>
            <div id="ansicht-umschalter" class="ansicht-umschalter" hidden>
              <button type="button" id="btn-pdf" class="um-btn aktiv">PDF</button>
              <button type="button" id="btn-text" class="um-btn">Text</button>
            </div>
            <button type="button" id="btn-druck-doc" class="druck-btn" hidden title="Dokument drucken">🖨</button>
          </div>
        </div>
        <label id="parent-zeile" class="parent-zeile" hidden>
          Hauptvertrag:
          <select id="parent-select"></select>
        </label>
      </div>

      <div id="doc-ansicht" class="doc-ansicht">
        <!-- PDF-Ansicht: gerendertes PDF mit markierbarer Textebene -->
        <div id="doc-pdf" class="doc-pdf" hidden>
          <div id="pdf-render" class="pdf-render"></div>
        </div>
        <!-- Text-Ansicht: reiner OCR-Text (markierbar) -->
        <article id="doc-content" class="doc-content">
          <p class="hinweis">Wähle links ein Dokument aus.</p>
        </article>
      </div>
    </section>

    <!-- Spalte 3: Themenliste (Klick öffnet die Zusammenfassung als Overlay) -->
    <section id="spalte-themen" class="spalte">
      <h2>Themen</h2>
      <div id="themenliste" class="themenliste"></div>
    </section>
  </main>

  <!-- Eigenes Kontextmenü für Markierungen -->
  <div id="ctxmenu" class="ctxmenu" hidden></div>

  <!-- Hinweisbanner (z. B. Verknüpfungsmodus) -->
  <div id="banner" class="banner" hidden></div>

  <!-- Themen-Zusammenfassung (Overlay) -->
  <div id="themen-overlay" class="overlay" hidden>
    <div class="overlay-panel">
      <div class="overlay-kopf">
        <h2 id="overlay-titel">Thema</h2>
        <div class="overlay-aktionen">
          <button type="button" id="thema-drucken" class="overlay-akt" title="Thema drucken">🖨</button>
          <button type="button" id="thema-umbenennen" class="overlay-akt" title="Thema umbenennen">✎</button>
          <button type="button" id="thema-loeschen" class="overlay-akt" title="Thema löschen">🗑</button>
          <button type="button" id="overlay-close" class="overlay-close" title="Schließen">✕</button>
        </div>
      </div>
      <div id="overlay-body" class="overlay-body"></div>
    </div>
  </div>

  <!-- Login (Paperless-Zugangsdaten) -->
  <div id="login-overlay" class="login-overlay" hidden>
    <form id="login-form" class="login-card">
      <h2>Anmelden</h2>
      <p class="login-hinweis">Mit deinen Paperless-Zugangsdaten anmelden.</p>
      <label>Benutzername
        <input type="text" id="login-user" autocomplete="username" required />
      </label>
      <label>Passwort
        <input type="password" id="login-pass" autocomplete="current-password" required />
      </label>
      <div id="login-fehler" class="login-fehler" hidden></div>
      <button type="submit" id="login-btn">Anmelden</button>
    </form>
  </div>

  <!-- Druckausgabe (nur beim Drucken sichtbar) -->
  <div id="druck-root"></div>

  <script src="static/app.js"></script>
</body>
</html>
